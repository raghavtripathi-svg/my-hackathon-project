    /* ===== PALANTIR / LINEAR CYBER-INDUSTRIAL DESIGN SYSTEM =================== */
    /* ========================================================================== */
    :root {
      --bg-base: #06090e;
      --bg-surface: #0c121d;
      --bg-elevated: #131c2e;
      --bg-panel: rgba(12, 18, 29, 0.94);
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(16, 185, 129, 0.4);
      --border-focus: #10b981;
      --text: #f8fafc;
      --text-muted: #8b9bb4;
      --text-dim: #54657e;
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --accent: #06b6d4;
      --accent-glow: rgba(6, 182, 212, 0.25);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.25);
      --warning: #f59e0b;
      --purple: #8b5cf6;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --radius: 8px;
      --radius-lg: 14px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.light-theme {
      --bg-base: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-elevated: #e2e8f0;
      --bg-panel: rgba(255, 255, 255, 0.96);
      --border: rgba(0, 0, 0, 0.09);
      --border-accent: rgba(5, 150, 105, 0.35);
      --border-focus: #059669;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --primary: #059669;
      --primary-hover: #047857;
      --primary-glow: rgba(5, 150, 105, 0.15);
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.15);
      --danger: #dc2626;
      --danger-glow: rgba(220, 38, 38, 0.15);
      --warning: #d97706;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 99999;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    button, input, select, textarea { font-family: inherit; font-size: 0.9rem; color: inherit; }
    button { cursor: pointer; border: 1px solid transparent; border-radius: var(--radius); transition: var(--transition); user-select: none; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 1px;
    }

    .btn {
      padding: 0.55rem 1.1rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 6px 18px var(--primary-glow); }
    .btn-secondary { background: var(--bg-surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg-elevated); border-color: var(--border-accent); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { opacity: 0.9; }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
    }
    .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-assigned { background: rgba(6, 182, 212, 0.15); color: var(--accent); border: 1px solid rgba(6, 182, 212, 0.4); }
    .badge-in_progress { background: rgba(139, 92, 246, 0.15); color: var(--purple); border: 1px solid rgba(139, 92, 246, 0.4); }
    .badge-resolved { background: rgba(16, 185, 129, 0.15); color: var(--primary); border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); }

    .panel {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      position: relative;
    }

    .header-bar {
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      cursor: pointer;
    }
    .brand-mark {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 900; font-size: 14px;
    }
    .nav-links { display: flex; gap: 0.4rem; list-style: none; }
    .nav-item {
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-muted);
    }
    .nav-item:hover { color: var(--text); background: var(--bg-surface); }
    .nav-item.active { color: var(--primary); background: rgba(16, 185, 129, 0.12); font-weight: 700; }

    .nav-actions { display: flex; align-items: center; gap: 0.75rem; }
    .icon-btn {
      position: relative;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .notif-badge {
      position: absolute;
      top: -4px; right: -4px;
      background: var(--danger);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      border-radius: 9999px;
      padding: 1px 5px;
    }

    .main-viewport {
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      padding: 1.5rem 2rem;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.25rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; }

    .form-group { margin-bottom: 1.1rem; }
    .form-group label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .form-control {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-surface);
      color: var(--text);
      font-size: 0.9rem;
      transition: var(--transition);
    }
    .form-control:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--primary-glow); }
    .form-error { color: var(--danger); font-size: 0.8rem; margin-top: 0.3rem; display: none; font-weight: 600; }
    .form-error.visible { display: block; }

    #toast-container {
      position: fixed;
      bottom: 1.5rem; right: 1.5rem;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      pointer-events: none;
    }
    .toast {
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius);
      color: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      min-width: 280px;
      opacity: 0;
      transform: translateY(20px);
      transition: var(--transition);
      pointer-events: auto;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast-success { background: var(--primary); }
    .toast-error { background: var(--danger); }
    .toast-info { background: var(--accent); }

    .stepper { display: flex; justify-content: space-between; position: relative; margin: 1.5rem 0; }
    .stepper::before {
      content: "";
      position: absolute;
      top: 14px; left: 20px; right: 20px;
      height: 2px;
      background: var(--border);
      z-index: 1;
    }
    .stepper-step { position: relative; z-index: 2; text-align: center; flex: 1; font-size: 0.75rem; }
    .stepper-dot {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 0.35rem auto;
      font-weight: 700; color: var(--text-muted);
    }
    .stepper-step.active .stepper-dot {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 0 12px var(--primary-glow);
    }
    .stepper-step.active { color: var(--text); font-weight: 700; }

    /* ========================================================================== */
    /* ===== GIS MAP ENGINE STYLES (ZOOM, PAN, HUDS, STREETS, PULSES) ========== */
    /* ========================================================================== */
    .gis-stage {
      width: 100%;
      height: 380px;
      background: #06090e;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }
    .gis-stage:active { cursor: grabbing; }

    .gis-ctrl-bar {
      position: absolute;
      top: 10px; left: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.35rem 0.75rem;
      display: flex;
      gap: 0.6rem;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      z-index: 25;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .gis-zoom-tools {
      position: absolute;
      top: 10px; right: 10px;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      z-index: 25;
    }
    .gis-tool-btn {
      width: 32px; height: 32px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1rem;
      box-shadow: var(--shadow);
    }
    .gis-tool-btn:hover { background: var(--bg-elevated); border-color: var(--border-accent); }

    .gis-live-coords-hud {
      position: absolute;
      bottom: 10px; left: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.25rem 0.55rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      z-index: 25;
      pointer-events: none;
    }

    .gis-hud-card {
      position: absolute;
      bottom: 12px; right: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1.1rem;
      font-size: 0.82rem;
      box-shadow: var(--shadow);
      max-width: 290px;
      display: none;
      z-index: 30;
    }

    @keyframes radarPulse {
      0% { r: 5; opacity: 1; }
      50% { r: 18; opacity: 0.4; }
      100% { r: 5; opacity: 1; }
    }
    .radar-pulse-ring {
      animation: radarPulse 2s infinite ease-in-out;
    }

    @keyframes laserScan {
      0% { top: 0%; opacity: 0.9; }
      50% { top: 96%; opacity: 1; }
      100% { top: 0%; opacity: 0.9; }
    }

    @media print {
      body { background: #fff !important; color: #000 !important; }
      .header-bar, #toast-container, .no-print, .btn, #confetti-canvas { display: none !important; }
      .panel { border: 1px solid #ccc !important; box-shadow: none !important; background: #fff !important; break-inside: avoid; }
      .main-viewport { max-width: 100% !important; padding: 0 !important; }
    }
  </style>
</head>

  init() {

      this.currentLang = saved;

      this.currentLang = "en";

        `<option value="${l.code}" ${l.code === this.currentLang ? "selected" : ""}>${escapeHTML(l.label)}</option>`
      ).join("");
    }
  },

  setLang(lang) {
    if (!this.languages.some(l => l.code === lang)) return;
    this.currentLang = lang;
    dbSet("ecopulse_lang_v2", lang);

    const user = Auth.getCurrentUser();
    if (user) {
      const users = Store.getUsers();
      const u = users.find(x => x.id === user.id);
      if (u) {
        u.preferredLang = lang;
        Store.setUsers(users);
      }
      user.preferredLang = lang;
      Store.setSession(user);
    }

    const sel = document.getElementById("lang-selector-header");
    if (sel && sel.value !== lang) sel.value = lang;

    Router.renderCurrent();
    AudioEngine.play("click");

    const dict = this.translations[this.currentLang];
    if (dict && dict[key] !== undefined) return dict[key];
    const enDict = this.translations["en"];
    return (enDict && enDict[key] !== undefined) ? enDict[key] : key;
  }

/* ===== SOUND SYNTHESIZER ENGINE (WEB AUDIO API - ZERO DEPENDENCY) ========= */
/* ========================================================================== */

const AudioEngine = {
  ctx: null,
  init() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !this.ctx) this.ctx = new AC();
    } catch(e) {}
  },
  play(type = "click") {
    try {
      this.init();
      if (!this.ctx) return;
      if (this.ctx.state === "suspended") this.ctx.resume();

      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);

      if (type === "click") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(350, t + 0.05);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.start(t);
        osc.stop(t + 0.05);
      } else if (type === "success") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(523.25, t);
        osc.frequency.setValueAtTime(659.25, t + 0.08);
        osc.frequency.setValueAtTime(783.99, t + 0.16);
        gain.gain.setValueAtTime(0.14, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.start(t);
        osc.stop(t + 0.35);
      } else if (type === "error") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(240, t);
        osc.frequency.setValueAtTime(160, t + 0.12);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.start(t);
        osc.stop(t + 0.25);
      } else if (type === "scan") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(1100, t);
        osc.frequency.exponentialRampToValueAtTime(2600, t + 0.18);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.start(t);
        osc.stop(t + 0.18);
      }
    } catch(e) {}
  }
};

const ConfettiSim = {
  canvas: null,
  ctx: null,
  particles: [],
  anim: null,
  init() {
    this.canvas = document.getElementById("confetti-canvas");
    if (this.canvas) this.ctx = this.canvas.getContext("2d");
  },
  trigger(dur = 2500) {
    this.init();
    if (!this.canvas) return;
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
    const palette = ["#10b981", "#06b6d4", "#f59e0b", "#6366f1", "#ec4899"];

    for (let i = 0; i < 80; i++) {
      this.particles.push({
        x: window.innerWidth * 0.5,
        y: window.innerHeight * 0.6,
        vx: (Math.random() - 0.5) * 16,
        vy: (Math.random() - 0.8) * 18,
        sz: Math.random() * 8 + 4,
        col: palette[Math.floor(Math.random() * palette.length)],
        rot: Math.random() * 360,
        vr: (Math.random() - 0.5) * 14,
        a: 1
      });
    }
    if (!this.anim) this.tick();
    setTimeout(() => { this.particles = []; }, dur);
  },
  tick() {
    if (!ConfettiSim.ctx) return;
    ConfettiSim.ctx.clearRect(0, 0, ConfettiSim.canvas.width, ConfettiSim.canvas.height);

    for (let i = ConfettiSim.particles.length - 1; i >= 0; i--) {
      const p = ConfettiSim.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.38;
      p.rot += p.vr;
      p.a -= 0.008;

      ConfettiSim.ctx.save();
      ConfettiSim.ctx.globalAlpha = Math.max(p.a, 0);
      ConfettiSim.ctx.translate(p.x, p.y);
      ConfettiSim.ctx.rotate((p.rot * Math.PI) / 180);
      ConfettiSim.ctx.fillStyle = p.col;
      ConfettiSim.ctx.fillRect(-p.sz / 2, -p.sz / 2, p.sz, p.sz);
      ConfettiSim.ctx.restore();

      if (p.a <= 0 || p.y > ConfettiSim.canvas.height) {
        ConfettiSim.particles.splice(i, 1);
      }
    }

    if (ConfettiSim.particles.length > 0) {
      ConfettiSim.anim = requestAnimationFrame(ConfettiSim.tick);
    } else {
      ConfettiSim.anim = null;
      ConfettiSim.ctx.clearRect(0, 0, ConfettiSim.canvas.width, ConfettiSim.canvas.height);
    }
  }
};

const memoryCache = {};

function dbGet(key, defaultVal) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : defaultVal;
  } catch(e) {
    return memoryCache[key] !== undefined ? memoryCache[key] : defaultVal;
  }
}

function dbSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch(e) {
    memoryCache[key] = val;
  }
}

function escapeHTML(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function generateId(prefix = "TKT") {
  return prefix + "-" + Math.floor(1000 + Math.random() * 9000);
}

function formatDate(iso) {
  if (!iso) return "N/A";
  const d = new Date(iso);
  return isNaN(d.getTime()) ? "N/A" : d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function toast(msg, type = "info") {
  AudioEngine.play(type === "error" ? "error" : "click");
  const box = document.getElementById("toast-container");
  const el = document.createElement("div");
  el.className = `toast toast-${type}`;
  el.innerText = msg;
  box.appendChild(el);
  setTimeout(() => el.classList.add("show"), 10);
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 250);
  }, 3500);
}

function showConfirm(title, message, callback) {
  const container = document.getElementById("modal-container");
  container.innerHTML = `
    <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:9999;">
      <div class="panel" style="max-width:440px;width:90%;">
        <h3>${escapeHTML(title)}</h3>
        <p style="color:var(--text-muted);margin:1rem 0 1.5rem 0;font-size:0.9rem;">${escapeHTML(message)}</p>
        <div style="display:flex;justify-content:flex-end;gap:0.5rem;">
          <button class="btn btn-secondary" data-action="close-modal">Cancel</button>
          <button class="btn btn-danger" id="confirm-modal-exec">Proceed</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById("confirm-modal-exec").onclick = () => {
    callback();
    container.innerHTML = "";
  };
}

async function hashPassword(pass, salt) {
  const salted = pass + "::" + salt;
  try {
    if (window.crypto && crypto.subtle && window.TextEncoder) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salted));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch(e) {}
  let h = 0;
  for (let i = 0; i < salted.length; i++) {
    h = (h << 5) - h + salted.charCodeAt(i);
    h |= 0;
  }
  return "fb_" + Math.abs(h).toString(16);
}

const Auth = {
  async initAdmin() {
    const users = Store.getUsers();
    if (!users.some(u => u.role === "admin")) {
      const salt = "slt_master_adm_99";
      const passHash = await hashPassword("Admin@123", salt);
      users.push({
        id: "admin_root",
        name: "Municipal Command Dispatcher",
        email: "admin@ecopulse.org",
        salt,
        passHash,
        role: "admin",
        ecoCredits: 9999,
        preferredLang: "en",
        createdAt: new Date().toISOString()
      });
      Store.setUsers(users);
    }
  },

  getCurrentUser() {
    return Store.getSession();
  },

  async register(name, email, pass) {
    const users = Store.getUsers();
    const cleanEmail = email.trim().toLowerCase();
    if (users.some(u => u.email.toLowerCase() === cleanEmail)) {
      throw new Error("This email address is already registered in registry.");
    }
    const salt = "slt_" + Math.random().toString(36).substr(2, 6);
    const passHash = await hashPassword(pass, salt);
    const user = {
      id: "usr_" + Math.random().toString(36).substr(2, 8),
      name: name.trim(),
      email: cleanEmail,
      salt,
      passHash,
      role: "citizen",
      ecoCredits: 50,
      preferredLang: I18nEngine.currentLang,
      createdAt: new Date().toISOString()
    };
    users.push(user);
    Store.setUsers(users);
    return user;
  },

  async login(email, pass) {
    const users = Store.getUsers();
    const u = users.find(x => x.email.toLowerCase() === email.trim().toLowerCase());
    if (!u) throw new Error("Invalid authorization credentials.");
    const check = await hashPassword(pass, u.salt);
    if (check !== u.passHash) throw new Error("Invalid authorization credentials.");

    const session = {
      id: u.id,
      name: u.name,
      email: u.email,
      role: u.role,
      ecoCredits: u.ecoCredits || 50,
      preferredLang: u.preferredLang || "en"
    };
    Store.setSession(session);
    if (u.preferredLang && u.preferredLang !== I18nEngine.currentLang) {
      I18nEngine.setLang(u.preferredLang);
    }
    return session;
  },

  logout() {
    Store.setSession(null);
    Router.navigate("home");
  },

  addCredits(userId, pts) {
    const users = Store.getUsers();
    const u = users.find(x => x.id === userId);
    if (u) {
      u.ecoCredits = (u.ecoCredits || 0) + pts;
      Store.setUsers(users);
      const s = Store.getSession();
      if (s && s.id === userId) {
        s.ecoCredits = u.ecoCredits;
        Store.setSession(s);
      }
    }
  },

  getReputationTier(pts = 0) {
    if (pts >= 300) return { title: "Circular Vanguard", color: "var(--accent)" };
    if (pts >= 120) return { title: "Green Guardian", color: "var(--primary)" };
    return { title: "Eco-Novice", color: "var(--warning)" };
  }
};

/* ========================================================================== */
/* ===== VECTOR GIS SOFTWARE ENGINE (PAN, ZOOM, 4 MODES, TSP ROUTING) ====== */
/* ========================================================================== */

const GISMapEngine = {
  viewports: {},
  pinnedCoords: { x: 220, y: 140 },

  initViewport(containerId) {
    if (!this.viewports[containerId]) {
      this.viewports[containerId] = {
        zoom: 1,
        panX: 0,
        panY: 0,
        isDragging: false,
        startX: 0,
        startY: 0
      };
    }
    return this.viewports[containerId];
  },

  render(containerId, options = {}) {
    const vp = this.initViewport(containerId);
    const mode = options.mode || "radar";
    const width = options.width || 460;
    const height = options.height || 360;
    const items = options.items || Store.getItems();
    const selectedItem = options.selectedItem || null;
    const now = Date.now();

    let pinsMarkup = "";
    if (mode === "picker") {
      pinsMarkup = `
        <g id="${containerId}-picker-pin" transform="translate(${this.pinnedCoords.x}, ${this.pinnedCoords.y})">
          <circle r="7" fill="var(--danger)" stroke="#fff" stroke-width="2"/>
          <circle r="16" fill="none" stroke="var(--danger)" stroke-width="1.5" class="radar-pulse-ring"/>
          <text y="-12" fill="#fff" font-size="9" font-weight="700" text-anchor="middle" font-family="var(--font-mono)">${this.pinnedCoords.x}E, ${this.pinnedCoords.y}N</text>
        </g>
      `;
    } else if (mode === "inspector" && selectedItem) {
      const cx = selectedItem.coords ? selectedItem.coords.x : 225;
      const cy = selectedItem.coords ? selectedItem.coords.y : 165;
      pinsMarkup = `
        <g transform="translate(${cx}, ${cy})">
          <circle r="8" fill="var(--accent)" stroke="#fff" stroke-width="2"/>
          <circle r="22" fill="none" stroke="var(--accent)" stroke-width="2" class="radar-pulse-ring"/>
          <text y="-14" fill="#fff" font-size="10" font-weight="800" text-anchor="middle" font-family="var(--font-mono)">${escapeHTML(selectedItem.id)}</text>
        </g>
      `;
    } else {
      pinsMarkup = items.map(it => {
        const cx = it.coords ? it.coords.x : (100 + (it.id.charCodeAt(4) * 8) % 260);
        const cy = it.coords ? it.coords.y : (80 + (it.id.charCodeAt(5) * 6) % 180);
        const isOverdue = it.status === "Pending" && ((now - new Date(it.createdAt).getTime()) / (1000 * 3600 * 24) > 3);
        const pinColor = isOverdue ? "var(--danger)" : it.status === "Resolved" ? "var(--primary)" : it.status === "In Progress" ? "var(--purple)" : "var(--warning)";

        return `
          <g data-action="gis-pin-inspect" data-id="${it.id}" style="cursor:pointer;">
            <circle cx="${cx}" cy="${cy}" r="5.5" fill="${pinColor}"/>
            <circle cx="${cx}" cy="${cy}" r="14" fill="none" stroke="${pinColor}" stroke-width="1.5" opacity="0.65"/>
          </g>
        `;
      }).join("");
    }

    return `
      <div class="gis-stage" id="${containerId}-frame">
        <div class="gis-ctrl-bar">
          <span>GIS MODE: ${mode.toUpperCase()}</span>
          <span id="${containerId}-zoom-readout">ZOOM: ${Math.round(vp.zoom * 100)}%</span>
        </div>

        <div class="gis-zoom-tools">
          <button class="gis-tool-btn" data-action="gis-zoom-in" data-target="${containerId}" title="Zoom In">+</button>
          <button class="gis-tool-btn" data-action="gis-zoom-out" data-target="${containerId}" title="Zoom Out">-</button>
          <button class="gis-tool-btn" data-action="gis-zoom-reset" data-target="${containerId}" title="Reset View" style="font-size:0.75rem;">&#8635;</button>
        </div>

        <div class="gis-live-coords-hud" id="${containerId}-coords-hud">WAYPOINT: ${this.pinnedCoords.x}E, ${this.pinnedCoords.y}N</div>

        <svg width="100%" height="100%" viewBox="0 0 ${width} ${height}" id="${containerId}-svg">
          <defs>
            <pattern id="${containerId}-grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#${containerId}-grid-pattern)" />

          <g id="${containerId}-panzoom-layer" transform="translate(${vp.panX}, ${vp.panY}) scale(${vp.zoom})">
            <path d="M 0 165 L 460 165 M 225 0 L 225 360 M 80 0 L 80 360 M 350 0 L 350 360 M 0 85 L 460 85 M 0 255 L 460 255" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>

            <rect x="20" y="20" width="180" height="130" fill="rgba(6,182,212,0.06)" stroke="rgba(6,182,212,0.25)" rx="8"/>
            <text x="30" y="40" fill="rgba(6,182,212,0.8)" font-size="8" font-weight="700">${escapeHTML(t("gis_sector_1"))}</text>

            <rect x="230" y="20" width="200" height="130" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.25)" rx="8"/>
            <text x="240" y="40" fill="rgba(16,185,129,0.8)" font-size="8" font-weight="700">${escapeHTML(t("gis_sector_2"))}</text>

            <rect x="20" y="180" width="220" height="150" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.25)" rx="8"/>
            <text x="30" y="200" fill="rgba(245,158,11,0.8)" font-size="8" font-weight="700">${escapeHTML(t("gis_sector_3"))}</text>

            <rect x="260" y="180" width="170" height="150" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.25)" rx="8"/>
            <text x="270" y="200" fill="rgba(239,68,68,0.8)" font-size="8" font-weight="700">${escapeHTML(t("gis_sector_4"))}</text>

            <circle cx="225" cy="165" r="9" fill="#fff" stroke="var(--primary)" stroke-width="3"/>
            <text x="225" y="150" fill="#fff" font-size="9" font-weight="800" text-anchor="middle" font-family="var(--font-mono)">${escapeHTML(t("gis_central_depot"))}</text>

            <path id="${containerId}-tsp-trajectory" d="" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.9"/>

            <g id="${containerId}-pins">${pinsMarkup}</g>
          </g>
        </svg>

        <div id="${containerId}-hud" class="gis-hud-card">
          <h5 id="${containerId}-hud-title">Ref ID</h5>
          <p id="${containerId}-hud-desc" style="color:var(--text-muted); margin:0.25rem 0 0.5rem 0; font-size:0.78rem;"></p>
          <div id="${containerId}-hud-status"></div>
        </div>
      </div>
    `;
  },

  attachControls(containerId, inputTargetId = null) {
    const frame = document.getElementById(`${containerId}-frame`);
    const svg = document.getElementById(`${containerId}-svg`);
    const layer = document.getElementById(`${containerId}-panzoom-layer`);
    const hudCoords = document.getElementById(`${containerId}-coords-hud`);
    if (!frame || !svg || !layer) return;

    const vp = this.initViewport(containerId);

    const updateTransform = () => {
      layer.setAttribute("transform", `translate(${vp.panX}, ${vp.panY}) scale(${vp.zoom})`);
      const zoomReadout = document.getElementById(`${containerId}-zoom-readout`);
      if (zoomReadout) zoomReadout.innerText = `ZOOM: ${Math.round(vp.zoom * 100)}%`;
    };

    frame.onmousedown = (e) => {
      if (e.target.closest(".gis-ctrl-bar") || e.target.closest(".gis-zoom-tools")) return;
      vp.isDragging = true;
      vp.startX = e.clientX - vp.panX;
      vp.startY = e.clientY - vp.panY;
    };

    window.addEventListener("mousemove", (e) => {
      if (!vp.isDragging) return;
      vp.panX = e.clientX - vp.startX;
      vp.panY = e.clientY - vp.startY;
      updateTransform();
    });

    window.addEventListener("mouseup", () => { vp.isDragging = false; });

    frame.onwheel = (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      vp.zoom = Math.min(Math.max(vp.zoom + delta, 0.6), 2.8);
      updateTransform();
    };

    svg.onmousemove = (e) => {
      const rect = svg.getBoundingClientRect();
      const clientX = e.clientX - rect.left;
      const clientY = e.clientY - rect.top;
      const svgX = Math.round(((clientX - vp.panX) / vp.zoom) * (460 / rect.width));
      const svgY = Math.round(((clientY - vp.panY) / vp.zoom) * (360 / rect.height));

      if (hudCoords) hudCoords.innerText = `CURSOR: ${Math.max(svgX, 0)}E, ${Math.max(svgY, 0)}N`;
    };

    if (inputTargetId) {
      svg.onclick = (e) => {
        if (e.target.closest(".gis-ctrl-bar") || e.target.closest(".gis-zoom-tools")) return;
        const rect = svg.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const clientY = e.clientY - rect.top;
        const x = Math.round(((clientX - vp.panX) / vp.zoom) * (460 / rect.width));
        const y = Math.round(((clientY - vp.panY) / vp.zoom) * (360 / rect.height));

        this.pinnedCoords = { x: Math.max(Math.min(x, 440), 20), y: Math.max(Math.min(y, 340), 20) };

        let sector = t("sec_1_name");
        if (x > 220 && y <= 160) sector = t("sec_2_name");
        else if (x <= 230 && y > 160) sector = t("sec_3_name");
        else if (x > 230 && y > 160) sector = t("sec_4_name");

        const targetEl = document.getElementById(inputTargetId);
        if (targetEl) targetEl.value = `${sector} [GIS: ${this.pinnedCoords.x}E, ${this.pinnedCoords.y}N]`;

        AudioEngine.play("click");
        toast(`Geotagged: ${this.pinnedCoords.x}E, ${this.pinnedCoords.y}N (${sector})`, "info");

        const pinsGroup = document.getElementById(`${containerId}-pins`);
        if (pinsGroup) {
          pinsGroup.innerHTML = `
            <g id="${containerId}-picker-pin" transform="translate(${this.pinnedCoords.x}, ${this.pinnedCoords.y})">
              <circle r="7" fill="var(--danger)" stroke="#fff" stroke-width="2"/>
              <circle r="16" fill="none" stroke="var(--danger)" stroke-width="1.5" class="radar-pulse-ring"/>
              <text y="-12" fill="#fff" font-size="9" font-weight="700" text-anchor="middle" font-family="var(--font-mono)">${this.pinnedCoords.x}E, ${this.pinnedCoords.y}N</text>
            </g>
          `;
        }
      };
    }
  },

  zoom(containerId, factor) {
    const vp = this.initViewport(containerId);
    if (factor === 0) {
      vp.zoom = 1; vp.panX = 0; vp.panY = 0;
    } else {
      vp.zoom = Math.min(Math.max(vp.zoom + factor, 0.6), 2.8);
    }
    const layer = document.getElementById(`${containerId}-panzoom-layer`);
    if (layer) layer.setAttribute("transform", `translate(${vp.panX}, ${vp.panY}) scale(${vp.zoom})`);
    const zoomReadout = document.getElementById(`${containerId}-zoom-readout`);
    if (zoomReadout) zoomReadout.innerText = `ZOOM: ${Math.round(vp.zoom * 100)}%`;
    AudioEngine.play("click");
  }
};

/* ===== DEMO DATA SEEDER (24 MULTI-DAY RECORDS) ============================ */
/* ========================================================================== */

async function seedDemoData() {
  const users = Store.getUsers();
  let citizen = users.find(u => u.email === "citizen@ecopulse.org");
  if (!citizen) {
    const salt = "slt_demo_cit";
    const passHash = await hashPassword("Citizen@123", salt);
    citizen = {
      id: "cit_demo_01",
      name: "Sophia Vance",
      email: "citizen@ecopulse.org",
      salt,
      passHash,
      role: "citizen",
      ecoCredits: 240,
      preferredLang: I18nEngine.currentLang,
      createdAt: new Date(Date.now() - 9 * 86400000).toISOString()
    };
    users.push(citizen);
    Store.setUsers(users);
  }

  const sectors = [
    { name: t("sec_1_name"), x: 80, y: 70 },
    { name: t("sec_2_name"), x: 380, y: 90 },
    { name: t("sec_3_name"), x: 150, y: 240 },
    { name: t("sec_4_name"), x: 320, y: 280 }
  ];
  const issues = ["Overflowing bin", "Garbage on road", "Missed collection", "Illegal dumping", "Hazardous dump"];
  const priorities = ["Low", "Medium", "High"];
  const teams = ["Team A (Rapid Compactor)", "Team B (Hazardous Recovery)", "Team C (Recycling Fleet)"];

  const seeded = [];
  const now = Date.now();

  for (let i = 0; i < 24; i++) {
    const isReport = i % 2 === 0;
    const daysAgo = Math.floor(i / 2.7);
    const createdTime = new Date(now - daysAgo * 86400000 - (i % 7) * 3600000).toISOString();
    const sec = sectors[i % sectors.length];

    let status = "Pending";
    if (i % 4 === 1) status = "Assigned";
    else if (i % 4 === 2) status = "In Progress";
    else if (i % 4 === 3) status = "Resolved";

    const item = {
      id: (isReport ? "REP-" : "PIK-") + (2000 + i),
      userId: citizen.id,
      category: isReport ? "report" : "pickup",
      createdAt: createdTime,
      status: status,
      timeline: [{ status: "Submitted", timestamp: createdTime, by: citizen.name }],
      assignedTeam: status !== "Pending" ? teams[i % teams.length] : null,
      adminRemark: status !== "Pending" ? "Sanitation crew assigned to municipal sector." : "",
      rating: status === "Resolved" ? (i % 2 === 0 ? 5 : 4) : 0,
      coords: { x: sec.x + (i * 7) % 30, y: sec.y + (i * 9) % 25 },
      readByCitizen: false,
      auditLog: [`${createdTime}: Ingested by ${citizen.name}`]
    };

    if (["Assigned", "In Progress", "Resolved"].includes(status)) {
      const tTime = new Date(new Date(createdTime).getTime() + 7200000).toISOString();
      item.timeline.push({ status: "Assigned", timestamp: tTime, by: "Admin Dispatcher" });
      item.auditLog.push(`${tTime}: Assigned to ${item.assignedTeam}`);
    }
    if (["In Progress", "Resolved"].includes(status)) {
      const tTime = new Date(new Date(createdTime).getTime() + 18000000).toISOString();
      item.timeline.push({ status: "In Progress", timestamp: tTime, by: item.assignedTeam });
      item.auditLog.push(`${tTime}: Vehicle in-transit`);
    }
    if (status === "Resolved") {
      const tTime = new Date(new Date(createdTime).getTime() + 32400000).toISOString();
      item.timeline.push({ status: "Resolved", timestamp: tTime, by: "Ground Operations" });
      item.auditLog.push(`${tTime}: Cleared by crew`);
    }

    if (isReport) {
      item.type = issues[i % issues.length];
      item.location = `${sec.name} [GIS: ${item.coords.x}E, ${item.coords.y}N]`;
      item.priority = priorities[i % priorities.length];
      item.description = "Persistent solid waste overflow spreading across sidewalk curb.";
      item.photos = [];
    } else {
      item.wasteType = "Dry/recyclable";
      item.address = `${sec.name} [GIS: ${item.coords.x}E, ${item.coords.y}N]`;
      item.pickupDate = "2026-10-06";
      item.timeSlot = "Morning (8 AM - 11 AM)";
      item.repeat = "One time";
      item.notes = "Segregated packages outside door.";
    }

    seeded.push(item);
  }

  Store.setItems(seeded);
  toast("Seeded 24 realistic multi-day incident records!", "success");
  Router.renderCurrent();
}

const Router = {
  currentRoute: "home",
  routes: ["home", "report", "pickup", "tracking", "awareness", "admin", "login", "register", "profile"],

  init() {
    window.addEventListener("hashchange", () => {
      const h = window.location.hash.replace("#", "").trim();
      this.navigate(h || "home", false);
    });
    const initial = window.location.hash.replace("#", "").trim() || "home";
    this.navigate(initial, false);
  },

  navigate(route, updateHash = true) {
    if (!this.routes.includes(route)) route = "home";
    const user = Auth.getCurrentUser();

    if (["report", "pickup", "tracking", "profile"].includes(route) && !user) {
      toast("Authentication required to access module.", "info");
      route = "login";
    }
    if (route === "admin" && (!user || user.role !== "admin")) {
      toast("Access Denied: Administrative authority required.", "error");
      route = "home";
    }

    this.currentRoute = route;
    if (updateHash) window.location.hash = route;
    this.renderCurrent();
  },

  renderCurrent() {
    const user = Auth.getCurrentUser();
    UI.renderNav(user);
    const view = document.getElementById("viewport");
    view.innerHTML = "";

    switch (this.currentRoute) {
      case "home": UI.renderHome(view); break;
      case "report": UI.renderReport(view); break;
      case "pickup": UI.renderPickup(view); break;
      case "tracking": UI.renderTracking(view); break;
      case "awareness": UI.renderAwareness(view); break;
      case "admin": UI.renderAdmin(view); break;
      case "login": UI.renderLogin(view); break;
      case "register": UI.renderRegister(view); break;
      case "profile": UI.renderProfile(view); break;
      default: UI.renderHome(view);
    }
    window.scrollTo(0, 0);
  }
};

    container.innerHTML = `

                <div id="pass-bar" style="height:100%; width:0%; background:var(--danger); transition:var(--transition);"></div>
              </div>
              <small id="pass-hint" style="font-size:0.75rem; color:var(--text-muted);"></small>
            </div>
            <div style="margin-bottom:1.25rem;">
              <label style="font-size:0.85rem; display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                <input type="checkbox" id="r-show"> Show Password
              </label>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Complete Registration</button>
            <div class="form-error" id="r-err" style="margin-top:0.75rem; text-align:center;"></div>
          </form>

          <p style="font-size:0.86rem; text-align:center; margin-top:1.5rem; color:var(--text-muted);">
            Existing user? <a href="#login" data-route="login">Sign In</a>
          </p>
        </div>
      </div>
    `;

    const passInput = document.getElementById("r-pass");
    const bar = document.getElementById("pass-bar");
    const hint = document.getElementById("pass-hint");

    passInput.oninput = () => {
      const v = passInput.value;
      let score = 0;
      if (v.length >= 6) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;

      bar.style.width = (score / 4) * 100 + "%";
      if (score <= 1) {
        bar.style.background = "var(--danger)";
        hint.innerText = "Strength: Vulnerable";
      } else if (score <= 3) {
        bar.style.background = "var(--warning)";
        hint.innerText = "Strength: Moderate";
      } else {
        bar.style.background = "var(--primary)";
        hint.innerText = "Strength: Cryptographically Solid";
      }
    };

    document.getElementById("r-show").onchange = (e) => {
      passInput.type = e.target.checked ? "text" : "password";

    document.getElementById("reg-form").onsubmit = async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("r-err");
      errBox.classList.remove("visible");

      if (passInput.value.length < 6) {
        errBox.innerText = "Password must be at least 6 characters.";
        errBox.classList.add("visible");
        return;
      }

      try {
        await Auth.register(document.getElementById("r-name").value, document.getElementById("r-email").value, passInput.value);
        toast("Registration successful! Please login.", "success");
        Router.navigate("login");
      } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.add("visible");
      }
    };
  },

            </div>

            <div class="form-group">

            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">${escapeHTML(t("btn_submit_incident"))}</button>

        <div class="panel">
          <h3>${escapeHTML(t("ai_lab_title"))}</h3>
          <p style="color:var(--text-muted); font-size:0.86rem; margin-bottom:1rem;">${escapeHTML(t("ai_lab_subtitle"))}</p>

          <div class="form-group">

          </div>

          <div id="ai-scanner-mount">
            <div style="height:220px; border:2px dashed var(--border); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:0.85rem;">

    GISMapEngine.attachControls("report-gis-picker", "rep-loc");

    const aiMount = document.getElementById("ai-scanner-mount");
    const previewBox = document.getElementById("photo-previews");
    const fileInput = document.getElementById("rep-file");

    function renderPreviews() {
      previewBox.innerHTML = photos.map((src, idx) => `
        <div style="position:relative; width:70px; height:70px; border-radius:6px; overflow:hidden; border:1px solid var(--border);">
          <img src="${src}" style="width:100%; height:100%; object-fit:cover;">
          <button type="button" data-del-img="${idx}" style="position:absolute; top:2px; right:2px; background:rgba(0,0,0,0.7); color:#fff; border-radius:50%; width:18px; height:18px; font-size:10px; border:none;">&times;</button>
        </div>
      `).join("");
      fileInput.disabled = photos.length >= 3;
    }
    renderPreviews();

    const saveDraftState = () => {
      Store.setDraft({
        type: document.getElementById("rep-type").value,
        location: document.getElementById("rep-loc").value,
        priority: document.getElementById("rep-prio").value,
        description: document.getElementById("rep-desc").value,
        photos: photos
      });
    };

    ["rep-type", "rep-loc", "rep-prio", "rep-desc"].forEach(id => {
      document.getElementById(id).addEventListener("input", saveDraftState);
    });

    document.getElementById("geo-btn").onclick = () => {
      AudioEngine.play("click");
      if (!navigator.geolocation) {
        toast("Geolocation unsupported in this browser.", "error");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const coords = `${t("sec_1_name")} [GPS: Lat ${pos.coords.latitude.toFixed(4)}, Long ${pos.coords.longitude.toFixed(4)}]`;
          document.getElementById("rep-loc").value = coords;
          saveDraftState();
          toast("Location geotagged via GPS!", "success");
        },
        () => toast("Permission denied or GPS offline.", "error")
      );
    };

    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (photos.length >= 3) {
        toast("Maximum 3 photos permitted.", "error");
        return;
      }

      AudioEngine.play("scan");
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxDim = 400;
          let w = img.width;
          let h = img.height;
          if (w > h) {
            if (w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          } else {
            if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.7);

          const imgData = ctx.getImageData(0, 0, w, h);
          let sumR = 0, sumG = 0, sumB = 0;
          for (let i = 0; i < imgData.data.length; i += 16) {
            sumR += imgData.data[i];
            sumG += imgData.data[i+1];
            sumB += imgData.data[i+2];
          }
          const totalPix = imgData.data.length / 16;
          const avgG = sumG / totalPix;
          const avgR = sumR / totalPix;

          let aiPrediction = t("rep_type_overflow");
          let prob = 89;
          if (avgG > avgR) { aiPrediction = t("rep_type_road"); prob = 94; }
          else if (avgR > 140) { aiPrediction = t("rep_type_haz"); prob = 86; }

          aiMount.innerHTML = `
            <div style="position:relative; border-radius:var(--radius); overflow:hidden; border:1px solid var(--accent); background:#000;">
              <img src="${dataUrl}" style="width:100%; max-height:220px; object-fit:contain; display:block;">
              <div style="position:absolute; top:0; left:0; width:100%; height:3px; background:var(--accent); box-shadow:0 0 15px var(--accent); animation: laserScan 2s infinite ease-in-out;"></div>
              <div style="position:absolute; top:25%; left:25%; width:50%; height:50%; border:2px dashed var(--primary); pointer-events:none;"></div>
              <div style="position:absolute; bottom:8px; left:8px; background:rgba(0,0,0,0.85); border:1px solid var(--accent); color:var(--accent); font-family:var(--font-mono); font-size:0.75rem; padding:0.25rem 0.55rem; border-radius:4px;">
                ${escapeHTML(t("ai_detection_label"))}: ${escapeHTML(aiPrediction)} (${prob}%)
              </div>
            </div>
            <div style="background:var(--bg-elevated); padding:0.75rem; border-radius:var(--radius); margin-top:0.75rem; font-size:0.84rem; display:flex; justify-content:space-between; align-items:center;">
              <span>${escapeHTML(t("ai_accept_prompt"))} <strong>${escapeHTML(aiPrediction)}</strong>?</span>
              <button type="button" class="btn btn-primary btn-sm" id="accept-ai-btn">${escapeHTML(t("btn_apply"))}</button>
            </div>
          `;

          document.getElementById("accept-ai-btn").onclick = () => {
            document.getElementById("rep-type").value = aiPrediction;
            toast("Applied AI recommendation: " + aiPrediction, "info");
            saveDraftState();
          };

          photos.push(dataUrl);
          renderPreviews();
          saveDraftState();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    };

    previewBox.onclick = (e) => {
      const idx = e.target.getAttribute("data-del-img");
      if (idx !== null) {
        photos.splice(Number(idx), 1);
        renderPreviews();
        saveDraftState();
      }
    };

    document.getElementById("report-form").onsubmit = (e) => {
      e.preventDefault();
      const user = Auth.getCurrentUser();
      const items = Store.getItems();
      const created = new Date().toISOString();

      const newTicket = {
        id: generateId("REP"),
        userId: user.id,
        category: "report",
        type: document.getElementById("rep-type").value,
        location: document.getElementById("rep-loc").value.trim(),
        priority: document.getElementById("rep-prio").value,
        description: document.getElementById("rep-desc").value.trim(),
        photos: photos,
        status: "Pending",
        timeline: [{ status: "Submitted", timestamp: created, by: user.name }],
        assignedTeam: null,
        adminRemark: "",
        rating: 0,
        coords: { x: GISMapEngine.pinnedCoords.x, y: GISMapEngine.pinnedCoords.y },
        createdAt: created,
        readByCitizen: true,
        auditLog: [`${created}: Report submitted by ${user.name}`]
      };

      items.unshift(newTicket);
      Store.setItems(items);
      Store.clearDraft();
      Auth.addCredits(user.id, 20);
      ConfettiSim.trigger(2500);
      AudioEngine.play("success");
      toast("Incident lodged! Awarded +20 Eco-Credits.", "success");
      Router.navigate("tracking");
    };
  },

    function checkCapacity() {
      const d = dInput.value;
      const s = sInput.value;
      if (!d || !s) { capBar.innerHTML = ""; subBtn.disabled = false; return; }

      const existing = Store.getItems().filter(i =>
        i.category === "pickup" && i.pickupDate === d && i.timeSlot === s && i.status !== "Cancelled"
      );

      const count = existing.length;
      if (count >= 3) {
        capBar.innerHTML = `<span style="color:var(--danger);">&#9888; ${escapeHTML(t("pik_slot_full"))}</span>`;
        subBtn.disabled = true;
      } else {
        capBar.innerHTML = `<span style="color:var(--primary);">&#10003; ${escapeHTML(t("pik_slot_avail"))} (${count}/3).</span>`;
        subBtn.disabled = false;
      }
    }

    sInput.onchange = checkCapacity;

    document.getElementById("pickup-form").onsubmit = (e) => {
      e.preventDefault();
      const user = Auth.getCurrentUser();
      const items = Store.getItems();
      const created = new Date().toISOString();

      const item = {
        id: generateId("PIK"),
        userId: user.id,
        category: "pickup",
        wasteType: document.getElementById("pik-type").value,
        address: document.getElementById("pik-addr").value.trim(),
        pickupDate: dInput.value,
        timeSlot: sInput.value,
        repeat: document.getElementById("pik-repeat").value,
        notes: document.getElementById("pik-notes").value.trim(),
        status: "Pending",
        timeline: [{ status: "Submitted", timestamp: created, by: user.name }],
        assignedTeam: null,
        adminRemark: "",
        rating: 0,
        coords: { x: GISMapEngine.pinnedCoords.x, y: GISMapEngine.pinnedCoords.y },
        createdAt: created,
        readByCitizen: true,
        auditLog: [`${created}: Pickup scheduled by ${user.name}`]
      };

      items.unshift(item);
      Store.setItems(items);
      Auth.addCredits(user.id, 15);
      ConfettiSim.trigger(2000);
      AudioEngine.play("success");
      toast("Pickup confirmed! +15 Eco-Credits awarded.", "success");
      Router.navigate("tracking");
    };

  renderTracking(container) {

    function renderList() {
      const q = searchInput.value.toLowerCase().trim();
      const st = filterSelect.value;
      const sort = sortSelect.value;

      let filtered = userItems.filter(item => {
        const matchesStatus = (st === "ALL" || item.status === st);
        const corpus = ((item.id || "") + " " + (item.type || "") + " " + (item.wasteType || "") + " " + (item.location || "") + " " + (item.address || "")).toLowerCase();
        const matchesSearch = !q || corpus.includes(q);
        return matchesStatus && matchesSearch;
      });

      filtered.sort((a, b) => {
        const tA = new Date(a.createdAt).getTime();
        const tB = new Date(b.createdAt).getTime();
        return sort === "NEWEST" ? tB - tA : tA - tB;

                  <div>${escapeHTML(t(stepKey))}</div>
                  <div style="font-size:0.68rem; color:var(--text-muted); margin-top:2px;">
                    ${hist ? formatDate(hist.timestamp) : "--"}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;

        let ratingHtml = "";
        if (item.status === "Resolved") {
          ratingHtml = `

                <button class="btn btn-danger btn-sm" data-action="cancel-item" data-id="${item.id}">${escapeHTML(t("btn_cancel"))}</button>
              </div>
            `;
          } else {
            pendingButtons = `
              <div style="display:flex; gap:0.5rem; margin-top:1rem;">
                <button class="btn btn-danger btn-sm" data-action="cancel-item" data-id="${item.id}">${escapeHTML(t("btn_withdraw"))}</button>

        return `

                <span class="badge badge-${item.status.toLowerCase().replace(" ", "_")}">${item.status}</span>
                <h3 style="margin-top:0.4rem;">${escapeHTML(isReport ? item.type : item.wasteType)}</h3>
                <p style="color:var(--text-muted); font-size:0.82rem;">Tracking Ref: ${escapeHTML(item.id)} &bull; ${formatDate(item.createdAt)}</p>
              </div>
              <div style="text-align:right;">
                <button class="btn btn-secondary btn-sm" data-action="inspect-gis-item" data-id="${item.id}">&#128205; ${escapeHTML(t("btn_inspect_gis"))}</button>
                ${item.assignedTeam ? `<div style="font-weight:700; color:var(--accent); font-size:0.85rem; margin-top:0.35rem;">Unit: ${escapeHTML(item.assignedTeam)}</div>` : ""}
              </div>
            </div>

            <div style="margin:0.85rem 0; font-size:0.9rem;">
              <p><strong>Location / Waypoint:</strong> ${escapeHTML(item.location || item.address)}</p>

                <p><strong>Priority:</strong> ${escapeHTML(item.priority)} &bull; <strong>Details:</strong> ${escapeHTML(item.description)}</p>
              ` : `
                <p><strong>Window:</strong> ${escapeHTML(item.pickupDate)} (${escapeHTML(item.timeSlot)}) &bull; <strong>Frequency:</strong> ${escapeHTML(item.repeat)}</p>
              `}
              ${item.adminRemark ? `
                <div style="background:var(--bg-elevated); padding:0.65rem 0.85rem; border-radius:var(--radius); margin-top:0.6rem; font-size:0.86rem; border-left:4px solid var(--primary);">
                  <strong>Admin Update:</strong> ${escapeHTML(item.adminRemark)}
                </div>

            </div>

            ${item.photos && item.photos.length ? `
              <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">

    searchInput.oninput = renderList;

    function updateAdminDashboard() {
      items = Store.getItems();
      const now = Date.now();
      const total = items.length;
      const pending = items.filter(i => i.status === "Pending").length;

      const overdue = items.filter(i => {
        if (i.status !== "Pending") return false;
        return (now - new Date(i.createdAt).getTime()) / (1000 * 3600 * 24) > 3;
      }).length;

      const resolved = items.filter(i => i.status === "Resolved");
      let avgHours = 0;
      if (resolved.length) {
        const totalMs = resolved.reduce((acc, it) => {
          const rh = it.timeline ? it.timeline.find(tItem => tItem.status === "Resolved") : null;
          return rh ? acc + (new Date(rh.timestamp).getTime() - new Date(it.createdAt).getTime()) : acc;
        }, 0);
        avgHours = Math.round(totalMs / (resolved.length * 3600000));
      }

      document.getElementById("admin-kpis").innerHTML = `

        </div>

          <div style="font-size:0.82rem; color:var(--danger);">${escapeHTML(t("adm_kpi_overdue"))}</div>
        </div>
        <div class="panel" style="text-align:center;">
          <div style="font-size:2rem; font-weight:800; color:var(--accent); font-family:var(--font-mono);">${avgHours}h</div>
          <div style="font-size:0.82rem; color:var(--text-muted);">${escapeHTML(t("adm_kpi_turnaround"))}</div>
        </div>
      `;

      const donutData = [
        { label: "Pending", value: items.filter(i => i.status === "Pending").length, color: "#f59e0b" },
        { label: "Assigned", value: items.filter(i => i.status === "Assigned").length, color: "#06b6d4" },
        { label: "In Progress", value: items.filter(i => i.status === "In Progress").length, color: "#8b5cf6" },
        { label: "Resolved", value: items.filter(i => i.status === "Resolved").length, color: "#10b981" }

      document.getElementById("chart-status").innerHTML = UI.drawDonut(donutData);

      const reports = items.filter(i => i.category === "report");
      const counts = {};
      reports.forEach(r => { counts[r.type] = (counts[r.type] || 0) + 1; });
      const barData = Object.keys(counts).map(k => ({ label: k, value: counts[k] }));
      document.getElementById("chart-types").innerHTML = UI.drawBars(barData);

      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now - i * 86400000);
        const iso = d.toISOString().split("T")[0];
        const c = items.filter(it => it.createdAt && it.createdAt.startsWith(iso)).length;
        days.push({ label: (d.getMonth() + 1) + "/" + d.getDate(), val: c });
      }
      document.getElementById("chart-trend").innerHTML = UI.drawTrend(days);

      renderAdminTable();

    function renderAdminTable() {
      const q = document.getElementById("adm-search").value.toLowerCase().trim();
      const st = document.getElementById("adm-filter-status").value;
      const cat = document.getElementById("adm-filter-cat").value;
      const tbody = document.getElementById("adm-table-body");

      const filtered = items.filter(it => {
        const matchStatus = (st === "ALL" || it.status === st);
        const matchCat = (cat === "ALL" || it.category === cat);
        const corpus = ((it.id || "") + " " + (it.type || "") + " " + (it.wasteType || "") + " " + (it.location || "") + " " + (it.address || "")).toLowerCase();
        const matchSearch = !q || corpus.includes(q);
        return matchStatus && matchCat && matchSearch;
      });

      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted); padding:1.5rem;">No matching incidents logged.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(it => `
        <tr style="border-bottom:1px solid var(--border);">
          <td style="padding:0.6rem;"><strong>${escapeHTML(it.id)}</strong></td>
          <td>${escapeHTML(it.type || it.wasteType)}</td>
          <td>${escapeHTML(it.location || it.address)}</td>
          <td><small>${formatDate(it.createdAt)}</small></td>
          <td><span class="badge badge-${it.status.toLowerCase().replace(" ", "_")}">${it.status}</span></td>
          <td><strong>${escapeHTML(it.assignedTeam || "Unassigned")}</strong></td>
          <td class="no-print">
            <div style="display:flex; gap:0.3rem;">
              <button class="btn btn-secondary btn-sm" data-action="admin-triage" data-id="${it.id}">${escapeHTML(t("btn_triage"))}</button>
              <button class="btn btn-danger btn-sm" data-action="admin-del" data-id="${it.id}">&times;</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    document.getElementById("adm-search").oninput = renderAdminTable;
    document.getElementById("adm-filter-status").onchange = renderAdminTable;
    document.getElementById("adm-filter-cat").onchange = renderAdminTable;

    document.getElementById("btn-run-fleet-optimizer").onclick = () => {
      AudioEngine.play("scan");
      const unres = items.filter(i => i.status !== "Resolved" && i.coords);
      if (!unres.length) {
        toast("No active unresolved incidents to route.", "info");
        return;
      }

      let current = { x: 225, y: 165 };
      const unvisited = [...unres];
      const route = [current];

      while (unvisited.length > 0) {
        let nearestIdx = 0;
        let minDst = Infinity;
        for (let i = 0; i < unvisited.length; i++) {
          const dx = unvisited[i].coords.x - current.x;
          const dy = unvisited[i].coords.y - current.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < minDst) { minDst = d; nearestIdx = i; }
        }
        current = unvisited[nearestIdx].coords;
        route.push(current);
        unvisited.splice(nearestIdx, 1);
      }
      route.push({ x: 225, y: 165 });

      const dStr = route.reduce((acc, pt, i) => `${acc} ${i === 0 ? "M" : "L"} ${pt.x} ${pt.y}`, "");
      const pathEl = document.getElementById("admin-gis-radar-tsp-trajectory");
      if (pathEl) pathEl.setAttribute("d", dStr);
      toast(`AI Optimized Loop: Routed ${unres.length} incident waypoints for compactor fleet!`, "success");
    };

    updateAdminDashboard();
  },

  drawDonut(data, size = 180) {
    const total = data.reduce((a, b) => a + b.value, 0);
    if (!total) return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="none" stroke="var(--border)" stroke-width="18"/><text x="50" y="54" text-anchor="middle" font-size="9" fill="var(--text-muted)">Empty</text></svg>`;

    let cur = 0;
    const slices = data.map(d => {
      const angle = (d.value / total) * 360;
      const start = cur;
      cur += angle;
      const r = 36;
      const x1 = 50 + r * Math.cos(((start - 90) * Math.PI) / 180);
      const y1 = 50 + r * Math.sin(((start - 90) * Math.PI) / 180);
      const x2 = 50 + r * Math.cos(((cur - 90) * Math.PI) / 180);
      const y2 = 50 + r * Math.sin(((cur - 90) * Math.PI) / 180);
      const large = angle > 180 ? 1 : 0;
      return angle >= 359.9
        ? `<circle cx="50" cy="50" r="${r}" fill="none" stroke="${d.color}" stroke-width="18"/>`
        : `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${d.color}" stroke-width="18"/>`;
    });

    return `
      <svg width="${size}" height="${size}" viewBox="0 0 100 100">
        ${slices.join("")}
        <text x="50" y="49" text-anchor="middle" font-weight="800" font-size="12" fill="var(--text)" font-family="var(--font-mono)">${total}</text>
        <text x="50" y="61" text-anchor="middle" font-size="7" fill="var(--text-muted)">LOGS</text>
      </svg>
    `;
  },

  drawBars(data, width = 280, height = 140) {
    if (!data.length) return `<p style="color:var(--text-muted);font-size:0.8rem;">No categories</p>`;
    const max = Math.max(...data.map(d => d.value), 1);
    const barWidth = Math.floor((width - 40) / data.length);
    let svg = `<svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}">`;
    svg += `<line x1="25" y1="${height - 25}" x2="${width - 10}" y2="${height - 25}" stroke="var(--border)" stroke-width="1"/>`;

    data.forEach((d, i) => {
      const h = (d.value / max) * (height - 50);
      const x = 30 + i * barWidth;
      const y = height - 25 - h;
      svg += `
        <rect x="${x}" y="${y}" width="${Math.max(barWidth - 8, 4)}" height="${h}" fill="var(--primary)" rx="3"/>
        <text x="${x + (barWidth - 8) / 2}" y="${y - 4}" font-size="9" font-weight="700" text-anchor="middle" fill="var(--text)" font-family="var(--font-mono)">${d.value}</text>
        <text x="${x + (barWidth - 8) / 2}" y="${height - 10}" font-size="7.5" text-anchor="middle" fill="var(--text-muted)">${escapeHTML(d.label.slice(0, 5))}</text>
      `;
    });
    svg += `</svg>`;
    return svg;
  },

  drawTrend(points, width = 280, height = 130) {
    if (!points.length) return `<p style="color:var(--text-muted);font-size:0.8rem;">No trend data</p>`;
    const max = Math.max(...points.map(p => p.val), 1);
    const step = (width - 40) / (points.length - 1 || 1);
    const coords = points.map((p, i) => ({
      x: 25 + i * step,
      y: height - 25 - (p.val / max) * (height - 45),
      label: p.label,
      val: p.val
    }));
    const dStr = coords.reduce((acc, c, i) => `${acc} ${i === 0 ? "M" : "L"} ${c.x} ${c.y}`, "");

    let svg = `<svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}">`;
    svg += `<line x1="20" y1="${height - 25}" x2="${width - 10}" y2="${height - 25}" stroke="var(--border)" stroke-width="1"/>`;
    svg += `<path d="${dStr}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>`;
    coords.forEach(c => {
      svg += `
        <circle cx="${c.x}" cy="${c.y}" r="3.5" fill="var(--bg-surface)" stroke="var(--accent)" stroke-width="2"/>
        <text x="${c.x}" y="${height - 10}" font-size="8" text-anchor="middle" fill="var(--text-muted)" font-family="var(--font-mono)">${escapeHTML(c.label)}</text>
      `;
    });
    svg += `</svg>`;
    return svg;

const QuizEngine = {
  questions: [
    { item: "Crushed aluminum soda can", correct: "Dry", options: ["Wet", "Dry", "Hazardous", "E-Waste"] },
    { item: "Vegetable peels & used tea bags", correct: "Wet", options: ["Wet", "Dry", "Hazardous", "E-Waste"] },
    { item: "Used lithium smartphone battery", correct: "Hazardous", options: ["Wet", "Dry", "Hazardous", "E-Waste"] },
    { item: "Frayed USB charging cord", correct: "E-Waste", options: ["Wet", "Dry", "Hazardous", "E-Waste"] },
    { item: "Cardboard courier box (flattened)", correct: "Dry", options: ["Wet", "Dry", "Hazardous", "E-Waste"] },
    { item: "Expired prescription pills", correct: "Hazardous", options: ["Wet", "Dry", "Hazardous", "E-Waste"] },
    { item: "Cooked rice and stew leftovers", correct: "Wet", options: ["Wet", "Dry", "Hazardous", "E-Waste"] },
    { item: "Broken computer mouse", correct: "E-Waste", options: ["Wet", "Dry", "Hazardous", "E-Waste"] },
    { item: "Glass tomato ketchup jar (rinsed)", correct: "Dry", options: ["Wet", "Dry", "Hazardous", "E-Waste"] },
    { item: "Pressurized insect repellent can", correct: "Hazardous", options: ["Wet", "Dry", "Hazardous", "E-Waste"] }
  ],
  idx: 0,
  score: 0,
  streak: 0,
  bestStreak: 0,

  init(container) {
    this.container = container;
    this.idx = 0;
    this.score = 0;
    this.streak = 0;
    this.render();
  },

  render() {
    if (this.idx >= this.questions.length) {
      this.renderCompletion();
      return;
    }
    const q = this.questions[this.idx];

    this.container.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
        <div>
          <h3>${escapeHTML(t("quiz_title"))}</h3>
          <p style="color:var(--text-muted); font-size:0.85rem;">${escapeHTML(t("quiz_subtitle"))}</p>
        </div>
        <div style="font-size:0.88rem; display:flex; gap:1.2rem; font-family:var(--font-mono);">
          <span>Round: <strong>${this.idx + 1} / ${this.questions.length}</strong></span>
          <span>Score: <strong>${this.score} pts</strong></span>
          <span>Streak: <strong style="color:var(--primary);">${this.streak}</strong> (Best: ${this.bestStreak})</span>
        </div>
      </div>

      <div style="background:var(--bg-elevated); padding:1.25rem; border-radius:var(--radius); margin:1.25rem 0; border:1px solid var(--border);">
        <p style="font-size:1.15rem; font-weight:600;">
          ${escapeHTML(t("quiz_question_prompt"))} <span style="color:var(--primary); text-decoration:underline;">${escapeHTML(q.item)}</span>?
        </p>
      </div>

      <div class="grid-2" style="gap:0.75rem;">
        ${q.options.map(opt => `
          <button class="btn btn-secondary" data-action="quiz-choice" data-val="${opt}" style="padding:1rem; font-size:1rem; justify-content:flex-start;">
            ${opt === "Wet" ? "&#127793; " + escapeHTML(t("aw_bin_wet")) : opt === "Dry" ? "&#9851; " + escapeHTML(t("aw_bin_dry")) : opt === "Hazardous" ? "&#9762; " + escapeHTML(t("aw_bin_haz")) : "&#128268; " + escapeHTML(t("aw_bin_ewaste"))}
          </button>
        `).join("")}
      </div>
      <div id="quiz-msg" style="margin-top:1rem; font-weight:700; min-height:24px;"></div>
    `;
  },

  handleAnswer(choice) {
    const q = this.questions[this.idx];
    const msg = document.getElementById("quiz-msg");
    const isCorrect = (choice === q.correct);

    if (isCorrect) {
      AudioEngine.play("success");
      this.score += 10;
      this.streak++;
      if (this.streak > this.bestStreak) this.bestStreak = this.streak;
      msg.innerHTML = `<span style="color:var(--primary);">&#10003; Correct! Belongs in the ${q.correct} bin.</span>`;
    } else {
      AudioEngine.play("error");
      this.streak = 0;
      msg.innerHTML = `<span style="color:var(--danger);">&#10007; Incorrect. Target bin: ${q.correct}.</span>`;
    }

    setTimeout(() => {
      this.idx++;
      this.render();
    }, 900);
  },

  renderCompletion() {
    ConfettiSim.trigger(3000);
    AudioEngine.play("success");
    const u = Auth.getCurrentUser();
    if (u) Auth.addCredits(u.id, this.score);

    this.container.innerHTML = `
      <div style="text-align:center; padding:2.5rem 1rem;">
        <h3 style="font-size:1.8rem; margin-bottom:0.5rem;">Challenge Completed!</h3>
        <p style="color:var(--text-muted); margin-bottom:1.5rem;">
          Final Score: <strong>${this.score} / ${this.questions.length * 10} pts</strong> &bull; Longest Streak: <strong>${this.bestStreak}</strong>
        </p>
        <p style="color:var(--primary); font-weight:700; margin-bottom:1.5rem;">
          &#9879; +${this.score} Eco-Credits added to your citizen reputation profile!
        </p>
        <button class="btn btn-primary" data-action="quiz-restart">Play Challenge Again</button>
      </div>
    `;
  }
};

/* ===== GLOBAL EVENT DELEGATION & GIS INSPECTION =========================== */

document.addEventListener("click", (e) => {
  const routeTarget = e.target.closest("[data-route]");
  if (routeTarget) {
    e.preventDefault();
    Router.navigate(routeTarget.getAttribute("data-route"));
    return;
  }

  const actTarget = e.target.closest("[data-action]");
  if (!actTarget) return;
  const action = actTarget.getAttribute("data-action");

  switch (action) {
    case "logout":
      Auth.logout();
      toast("Signed out successfully.", "info");
      break;

    case "close-modal":
      document.getElementById("modal-container").innerHTML = "";
      break;

    case "gis-zoom-in": {
      const target = actTarget.getAttribute("data-target");
      GISMapEngine.zoom(target, 0.2);
      break;
    }

    case "gis-zoom-out": {
      const target = actTarget.getAttribute("data-target");
      GISMapEngine.zoom(target, -0.2);
      break;
    }

    case "gis-zoom-reset": {
      const target = actTarget.getAttribute("data-target");
      GISMapEngine.zoom(target, 0);
      break;
    }

    case "quiz-choice":
      QuizEngine.handleAnswer(actTarget.getAttribute("data-val"));
      break;

    case "quiz-restart":
      QuizEngine.init(document.getElementById("quiz-mount"));
      break;

    case "inspect-gis-item": {
      const id = actTarget.getAttribute("data-id");
      const items = Store.getItems();
      const targetItem = items.find(i => i.id === id);
      if (!targetItem) return;

      const modal = document.getElementById("modal-container");
      modal.innerHTML = `
        <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:9999;">

            </div>

        document.getElementById("admin-gis-radar-hud-desc").innerText = `${item.location || item.address} - Unit: ${item.assignedTeam || "None"}`;

        hud.style.display = "block";

    case "rate-item": {
      const id = actTarget.getAttribute("data-id");
      const val = parseInt(actTarget.getAttribute("data-val"), 10);

      const target = items.find(i => i.id === id);
