        Store.setItems(items);
        modal.innerHTML = "";
        AudioEngine.play("success");
        toast("Pickup window rescheduled!", "success");
        Router.renderCurrent();
      };
      break;
    }

    case "admin-triage": {
      const id = actTarget.getAttribute("data-id");
      const items = Store.getItems();
      const item = items.find(i => i.id === id);
      if (!item) return;

      const modal = document.getElementById("modal-container");
      modal.innerHTML = `
        <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:9999;">
          <div class="panel" style="max-width:480px;width:90%;">
            <h3>Municipal Task Triage</h3>
            <p style="color:var(--text-muted);font-size:0.84rem;margin-bottom:1.25rem;">Reference: ${escapeHTML(item.id)}</p>

            <div class="form-group">
              <label>Status</label>
              <select id="adm-st" class="form-control">
                <option ${item.status === "Pending" ? "selected" : ""}>Pending</option>
                <option ${item.status === "Assigned" ? "selected" : ""}>Assigned</option>
                <option ${item.status === "In Progress" ? "selected" : ""}>In Progress</option>
                <option ${item.status === "Resolved" ? "selected" : ""}>Resolved</option>
              </select>
            </div>

            <div class="form-group">
              <label>Response Team</label>
              <select id="adm-tm" class="form-control">
                <option value="">Unassigned</option>
                <option ${item.assignedTeam && item.assignedTeam.includes("Team A") ? "selected" : ""}>Team A (Rapid Compactor)</option>
                <option ${item.assignedTeam && item.assignedTeam.includes("Team B") ? "selected" : ""}>Team B (Hazardous Recovery)</option>
                <option ${item.assignedTeam && item.assignedTeam.includes("Team C") ? "selected" : ""}>Team C (Recycling Fleet)</option>
              </select>
            </div>

            <div class="form-group">
              <label>Official Remark for Citizen</label>
              <textarea id="adm-rmk" class="form-control" rows="3" placeholder="Explain action taken or instructions...">${escapeHTML(item.adminRemark || "")}</textarea>
            </div>

            <div style="display:flex;justify-content:flex-end;gap:0.5rem;margin-top:1.5rem;">
              <button class="btn btn-secondary" data-action="close-modal">Cancel</button>
              <button class="btn btn-primary" id="adm-save-triage">Save Updates</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById("adm-save-triage").onclick = () => {
        const nextStatus = document.getElementById("adm-st").value;
        const nextTeam = document.getElementById("adm-tm").value;
        const nextRemark = document.getElementById("adm-rmk").value.trim();

        if (nextStatus !== item.status) {
          if (!item.timeline) item.timeline = [];
          item.timeline.push({ status: nextStatus, timestamp: new Date().toISOString(), by: "Admin Dispatcher" });
        }
        item.status = nextStatus;
        item.assignedTeam = nextTeam;
        item.adminRemark = nextRemark;
        item.readByCitizen = false;

        if (!item.auditLog) item.auditLog = [];
        item.auditLog.push(`${new Date().toISOString()}: Updated to ${nextStatus} by Admin`);

        Store.setItems(items);
        modal.innerHTML = "";
        AudioEngine.play("success");
        toast("Task triage saved successfully.", "success");
        Router.renderCurrent();
      };
      break;
    }

    case "admin-del": {
      const id = actTarget.getAttribute("data-id");
      showConfirm("Delete Master Entry", "Permanently excise this record from municipal storage?", () => {
        let items = Store.getItems();
        items = items.filter(i => i.id !== id);
        Store.setItems(items);
        toast("Entry removed.", "info");
        Router.renderCurrent();
      });
      break;
    }

    case "admin-seed":
      seedDemoData();
      break;

    case "admin-reset":
      showConfirm("Purge Database", "Reset all incident logs and bookings to zero?", () => {
        Store.setItems([]);
        toast("Database purged.", "info");
        Router.renderCurrent();
      });
      break;

    case "admin-export": {
      const items = Store.getItems();
      if (!items.length) {
        toast("No data available to export.", "error");
        return;
      }
      const headers = ["ID", "Category", "Classification", "Location", "Status", "DispatchedTeam", "CreatedAt", "AdminRemark", "Rating"];
      const rows = items.map(i => [
        `"${i.id}"`,
        `"${i.category}"`,
        `"${(i.type || i.wasteType || "").replace(/"/g, '""')}"`,
        `"${(i.location || i.address || "").replace(/"/g, '""')}"`,
        `"${i.status}"`,
        `"${(i.assignedTeam || "").replace(/"/g, '""')}"`,
        `"${i.createdAt}"`,
        `"${(i.adminRemark || "").replace(/"/g, '""')}"`,
        `"${i.rating || 0}"`
      ]);
      const csvStr = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
      const link = document.createElement("a");
      link.setAttribute("href", encodeURI(csvStr));
      link.setAttribute("download", `ecopulse_telemetry_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      AudioEngine.play("success");
      toast("CSV exported successfully.", "success");
      break;
    }

    case "admin-print":
      window.print();
      break;
  }
});

/* ========================================================================== */
/* ===== THEME ENGINE & APPLICATION INITIALIZATION ========================== */
/* ========================================================================== */

const ThemeManager = {
  init() {
    const saved = dbGet("ecopulse_theme_v8", null);
    if (saved === "light") {
      document.body.classList.add("light-theme");
      document.getElementById("theme-toggle").innerHTML = "&#9790;";
    } else {
      document.body.classList.remove("light-theme");
      document.getElementById("theme-toggle").innerHTML = "&#9788;";
    }

    document.getElementById("theme-toggle").onclick = () => {
      const isLight = document.body.classList.toggle("light-theme");
      dbSet("ecopulse_theme_v8", isLight ? "light" : "dark");
      document.getElementById("theme-toggle").innerHTML = isLight ? "&#9790;" : "&#9788;";
      AudioEngine.play("click");
    };
  }
};

document.getElementById("notif-btn").onclick = () => {
  Router.navigate("tracking");
};

const langSelHeader = document.getElementById("lang-selector-header");
if (langSelHeader) {
  langSelHeader.onchange = (e) => {
    I18nEngine.setLang(e.target.value);
  };
}

window.addEventListener("DOMContentLoaded", async () => {
  I18nEngine.init();
  await Auth.initAdmin();
  ThemeManager.init();
  Router.init();
});
  </script>
</body>
</html>
